<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatau Lanches</title>
    <link rel="stylesheet" href="./menucs.css">
    <link rel="icon" type="image/png" href="./imagem/catatau.png" alt="favicon do catatau">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Ultra&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="top-banner">
        ATENÇÃO! Confira nossos cupons promocionais disponíveis no app e site oficiais.
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <section class="logonav">
                <img src="./imagem/catatauimg.png">
            </section>

            <a 
            href="./menu/index.html" class="voltar-menu">
                <i class="material-icons">arrow_back_ios</i>
                <span class="voltar">Voltar</span>
            </a>

            <section class="banner-login">
                <img src="./imagem/banner-login.png" alt="banner do lugar">
            </section>
        </div>
    </nav>

    <section class="quadrado">
        <section class="cadastro">
            <div class="logocadastro">
                <img src="./imagem/catatauimg.png">
            </div>
            <h1 class="primeiro">Criar uma conta</h1>

            <div class="segundo">Bem vindo ao Catatau Lanches!</div>

            <input type="text" placeholder="Nome completo" title="Digite seu nome completo" class="nome">

            <input type="text" placeholder="E-mail" title="catataucliente@gmail.com" class="email">

            <input type="text" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="Informe seu CPF"
                title="xxx.xxx.xxx-xx" id="CPF" name="CPF" required />

            <div class="container-tel">
                <input type="tel" placeholder="DDD" pattern="[0-9]{2}" class="ddd" title="O DDD deve ter 2 números"
                    required>

                <input type="tel" class="numero" placeholder="99999-9999" pattern="9[0-9]{4}-[0-9]{4}"
                    title="Formato esperado: 99999-9999" required>
            </div>

            <input type="password" placeholder="Senha" class="senha">

            <input type="password" placeholder="Repetir Senha" class="repetir-senha">

            <div class="container-box">
                <input type="checkbox" id="box" name="box">
                <label for="lembrar">Quero receber novidades, Descontos e promoções</label>
            </div>
            <a href class="cadastrar" style="text-decoration: none">Criar uma conta</a>
            <a href="/login/Menu.html" class="existente" style="text-decoration: none">Entrar em conta existente</a>

        </section>
    </section>
</body>

</html>
